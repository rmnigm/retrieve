bloom:
  m_bits: 1024
  k_hash: 5
timed-bloom-d128:
  datasets:
  - arxiv
  - goodreads
  dims:
  - 128
  filter_kinds:
  - bloom
  - clause
  ks:
  - 100
  batch_sizes:
  - 1
  - 16
  - 64
  seeds:
  - 0
  - 1
  - 2
  sweeps:
    arxiv:
    - all4
    - c0_maincat
    - c3_nversions
    goodreads:
    - c0_genre
  interleave:
  - by:
    - algo
    - n_lists
  arms:
  - algo: linr_v1_filter_mask
    backends:
    - triton
    filter_kinds:
    - clause
  - algo: linr_v2
    backends:
    - triton
    filter_kinds:
    - clause
  - algo: linr_v3
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      arxiv:
        sweeps:
        - all4
        query:
          candidate_pool_frac:
          - 0.2
  - algo: linr_v3
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      arxiv:
        sweeps:
        - c0_maincat
        query:
          candidate_pool_frac:
          - 0.1
          - 0.2
  - algo: linr_v3
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      arxiv:
        sweeps:
        - c3_nversions
        query:
          candidate_pool_frac:
          - 0.05
          - 0.1
  - algo: linr_v3
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      goodreads:
        sweeps:
        - c0_genre
        query:
          candidate_pool_frac:
          - 0.02
          - 0.05
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - all4
        query:
          n_probe:
          - 24
          - 256
          - 512
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - c0_maincat
        query:
          n_probe:
          - 24
          - 64
          - 512
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - c3_nversions
        query:
          n_probe:
          - 24
          - 64
          - 512
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 4096
      recheck:
      - false
    datasets:
      goodreads:
        sweeps:
        - c0_genre
        query:
          n_probe:
          - 24
          - 32
          - 64
