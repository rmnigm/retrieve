# `synth` and `filter` without their arm on Meta's code as published, which this repository no
# longer installs: the rest of each suite as run, runnable here.
synth-shipped:
  datasets: [goodreads-synth, arxiv-synth, arxiv-corr-synth]
  dims: [128]
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0]
  sweeps:
    arxiv-synth: [p0001, p0003, p001, p003, p005, p01, p02, p05, p1]
  ks_by_sweep:
    goodreads-synth:
      p0001: [100]
      p0003: [100]
    arxiv-synth:
      p0001: [100]
  interleave:
  - by: algo
    values: [linr_v1_filter_mask, linr_v2]
  arms:
  - algo: linr_v1_filter_mask
    backends: [triton]
    filter_kinds: [clause]
    datasets:
      goodreads-synth: {}
      arxiv-synth: {}
  - algo: linr_v2
    backends: [triton]
    filter_kinds: [clause]
    datasets:
      goodreads-synth: {}
      arxiv-synth: {}
  - algo: linr_v3
    backends: [triton]
    query:
      candidate_pool_frac: [0.01, 0.05]
    datasets:
      goodreads-synth:
        sweeps: [p0001, p0003, p001, p003, p01, p03, p1]
      arxiv-corr-synth: {}
    filter_kinds: [clause]
  - algo: postfilter
    backends: [torch]
    query:
      alpha: [1, 8]
    datasets:
      goodreads-synth:
        sweeps: [p0001, p0003, p001, p003, p01, p03, p1]
      arxiv-corr-synth: {}
    filter_kinds: [clause]
  - algo: linr_v2
    backends: [torch]
    sweeps: [p001, p01, p1]
    datasets:
      goodreads-synth: {}
    filter_kinds: [clause]
  - algo: linr_v2
    backends: [torch]
    sweeps: [p001, p01, p1]
    build:
      compile: [max-autotune]
    datasets:
      goodreads-synth: {}
    filter_kinds: [clause]
filter-shipped:
  datasets: [goodreads, arxiv, pubmed]
  dims: [128, 768]
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre, c1_lang_reverse, all4]
    arxiv: [c3_nversions, c0_maincat, all4]
    pubmed: [c0_mesh, c3_journal_reverse, all5]
  interleave:
  - by: algo
    values: [linr_v1_filter_mask, linr_v2]
  arms:
  - algo: linr_v1_filter_mask
    backends: [triton]
    filter_kinds: [clause]
  - algo: linr_v2
    backends: [triton]
    filter_kinds: [clause]
  - algo: linr_v3
    backends: [triton]
    filter_kinds: [clause]
  - algo: postfilter
    backends: [torch]
    query:
      alpha: [1, 8]
    filter_kinds: [clause]
