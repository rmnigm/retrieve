# Suites of the remaining runs the tables read (native PyTorch, V3 code length, the recall bridge, the
# exact-filter LiNR runs and the reverse-clause clause-filter runs), as measured.
filter:
  datasets: [goodreads, arxiv, pubmed]
  dims: [128, 768]
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre, c1_lang_reverse, all4]
    arxiv: [c3_nversions, c0_maincat, all4]
    pubmed: [c0_mesh, c3_journal_reverse, all5]
  interleave:
    - {by: algo, values: [linr_v1_filter_mask, linr_v2]}
  arms:
    - {algo: linr_v1_filter_mask, backends: [triton], filter_kinds: [clause]}
    - {algo: linr_v2, backends: [triton], filter_kinds: [clause]}
    - {algo: linr_v3, backends: [triton], filter_kinds: [clause]}
    - algo: silvertorch
      backends: [published]
      filter_kinds: [bloom]
      query: {n_probe: [24]}
      datasets:
        goodreads: {build: {n_lists: [4096]}, query: {n_probe: [24, 64]}}
        arxiv: {build: {n_lists: [2048]}, query: {n_probe: [24, 256]}}
        pubmed: {build: {n_lists: [4096]}, query: {n_probe: [24, 512, 1024]}}
    - {algo: postfilter, backends: [torch], query: {alpha: [1, 8]}, filter_kinds: [clause]}
