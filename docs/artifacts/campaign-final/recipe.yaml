totals_gpu_h:                           # per GPU, incl. the 1.45 process overhead; wall-clock = the largest
  b: 17.4
  d0: 19.8
  d1: 19.4
  p1: 17.1

gates:                                 # D1-G over campaign-final/ after the last leg
  - eager-vs-graph ids from the stored hashes
  - a byte-identical quality subset per leg (--force into a scratch tree)
  - median_ms(bs=16) < 16 x median_ms(bs=1) (real-filter V2 / V3 exceed it by the per-query spread: c1-real)
  - bench report --manifest over campaign-final/; results.parquet + its manifest sha in hub-index
