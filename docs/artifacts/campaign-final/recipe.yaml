    command: "\"$VENV/bin/python\" -m bench.cli run --dataset goodreads --dim 128 --suite filter --algo linr_v1_filter_mask --algo linr_v2 --interleave --out /scratch/final/gpu0 --resume"
    upload: campaign-final/goodreads-filter-d0
