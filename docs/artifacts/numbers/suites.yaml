  k_hash: 5
n-linr-bs64:
  datasets:
  - goodreads
  - arxiv
  - pubmed
  - yfcc10m
  dims:
  - 128
  - 192
  - 768
  filter_kinds:
  - clause
  ks:
  - 100
  - 1000
  batch_sizes:
  - 64
  - 256
  seeds:
  - 0
  sweeps:
    goodreads:
    - all4
    - c0_genre
    - c1_lang_reverse
    arxiv:
    - all4
    - c0_maincat
    - c3_nversions
    pubmed:
    - all5
    - c0_mesh
    - c3_journal_reverse
    yfcc10m:
    - tags_and
  arms:
  - algo: linr_v1_filter_mask
    backends:
    - triton
  - algo: linr_v2
    backends:
    - triton
  interleave:
  - by: algo
    values:
    - linr_v1_filter_mask
    - linr_v2
