# OpenAlex works + nomic-embed-text-v1.5 at its native 768 dims — roadmap E3's OpenAlex
# fallback of the Semantic Scholar SPECTER2 slice (named for the data it holds, not the S2
# plan), staged as a 15 M catalog. In no suite: at 15 M x 768 the harness oracle's
# transposed item copy does not fit the A100 (roadmap E3); nothing produced from this file
# is citable. Clause layout (docs/system/datasets.md § openalex): C0 field,
# C1 earlier_era (item era strictly before the query's), C2 subfield, C3 source (REVERSE —
# bloom-incompatible), C4 is_oa. The query side is the held-out paper's own field / era /
# subfield / venue; field_era is the roadmap's "year < query year, same field".
data_dir: data/openalex
content_dir: content_d768                 # relative to data_dir
dims: [768]
users_limit: 10000
filters:
  attrs: item_attrs_narrow.pt
  reverse: clause_is_reverse_narrow.pt
  clause: {field_era: [0, 1], c0_field: [0], c1_era: [1], c2_subfield: [2], c3_source_reverse: [3], all5: [0, 1, 2, 3, 4]}
  bloom: {field_era: [0, 1], c0_field: [0], c1_era: [1], c2_subfield: [2]}
