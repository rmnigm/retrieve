# laion30m on synthetic selectivity attrs (docs/system/datasets.md § Synthetic selectivity attrs): the parent's
# data_dir, embeddings and queries; the attrs are `eval-data synth-filter --dataset laion30m`'s. Clause j passes item i
# iff u_i < rates[j], rates `synth_filter.RATES` (0.001, 0.003, 0.01, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5, 1.0); the query
# side is all ones. The synth suite picks four of the ten rates (user: the real filters are too harsh for laion).
data_dir: data/laion30m
content_dir: content_d256
dims: [256]
users_limit: 10000
filters:
  attrs: item_attrs_synth.pt
  query_attrs: query_attrs_synth.pt
  clause: {p0001: [0], p0003: [1], p001: [2], p003: [3], p005: [4], p01: [5], p02: [6], p03: [7], p05: [8], p1: [9]}
