# Draw 2 of arxiv-corr-synth (seed 20261008 + 2; docs/system/datasets.md § Synthetic selectivity attrs): arxiv-corr-synth.yaml with draw 2's attrs; run at job seed 2.
# arXiv on cluster-correlated synthetic attrs (docs/system/datasets.md § Synthetic selectivity
# attrs): arxiv-synth's data_dir, content and users_limit, the attrs from `eval-data synth-filter
# --dataset arxiv --correlated`. Clause j is a k-means over the d128 items with round(1/p_j)
# centroids, p (0.01, 0.03, 0.1); item value = its cluster, query value = its nearest centroid.
# The clusters come from d128, so d128 is the only dim. Bloom, as on arxiv-synth, measures cost.
data_dir: data/arxiv-papers
content_dir: {128: content_d128}   # relative to data_dir
dims: [128]
users_limit: 10000
self_match: true                          # queries are catalogue items (docs/system/evaluation.md § Self-match)
filters:
  attrs: item_attrs_corr_s2.pt             # relative to data_dir
  query_attrs: query_attrs_corr_s2.pt
  clause: {c001: [0], c003: [1], c01: [2]}
  bloom: {c001: [0], c003: [1], c01: [2]}
