# arXiv on synthetic selectivity attrs (docs/system/datasets.md § Synthetic selectivity attrs):
# the parent's data_dir, encoder and users_limit, so the item embeddings, queries and encode cache are
# the parent's; the attrs are `eval-data synth-filter --dataset arxiv`'s. Clause j passes item i
# iff u_i < rates[j], rates `synth_filter.RATES` (0.001, 0.003, 0.01, 0.03, 0.05, 0.1, 0.2, 0.3, 0.5, 1.0); the query side is all ones.
# Sweep names stay apart from the parent's in the shared gt_d{dim} (and every blob name carries
# the attrs digest anyway). One value per clause, so bloom here measures the bloom path's cost,
# not its false-positive rate (that is bloomwidth's job).
data_dir: data/arxiv-papers
content_dir: {64: content_d64, 128: content_d128, 256: content}   # relative to data_dir
dims: [64, 128, 256]
users_limit: 10000
filters:
  attrs: item_attrs_synth.pt             # relative to data_dir
  query_attrs: query_attrs_synth.pt
  clause: {p0001: [0], p0003: [1], p001: [2], p003: [3], p005: [4], p01: [5], p02: [6], p03: [7], p05: [8], p1: [9]}
  bloom: {p0001: [0], p0003: [1], p001: [2], p003: [3], p005: [4], p01: [5], p02: [6], p03: [7], p05: [8], p1: [9]}
