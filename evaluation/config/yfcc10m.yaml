# YFCC-10M (Big-ANN filtered track) at its native 192 dims — harness v2 dataset file (H §3.3),
# the v2 shape of the old config/yfcc10m/d192-filter.yaml. Listed in the `filter` suite of
# suites.yaml since 2026-09-16 (roadmap E1); the suite's ks (100/500/1000) are deeper than the
# shipped GT's k=10, which is fine because recall is measured against the harness's own
# cosine oracle, not the shipped GT. Pre-encoded text shape: the organisers' 100k query
# vectors are content_d192/query_emb.pt; the *.meta.json sidecars declare `prefix: null`
# (CLIP has no nomic prefix to assert). One sweep, `tags_and`: clause 0 = the query's
# first tag, clause 1 = its second (-1, "always pass", on single-tag queries), ANDed — the
# organisers' conjunctive predicate over the capped 32-tag bags (docs/system/datasets.md
# § yfcc10m for the cap and the cosine-vs-L2 caveat). No bloom block: a bloom's false
# positives would make the cross-check against the shipped GT meaningless (roadmap D3).
data_dir: data/yfcc10m
content_dir: content_d192                 # relative to data_dir
dims: [192]
users_limit: 10000
filters:
  attrs: item_attrs_narrow.pt
  reverse: clause_is_reverse_narrow.pt
  clause: {tags_and: [0, 1]}
