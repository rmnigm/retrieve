# Harness v2 suites (H §3.3, §8.2 A/J; backends per H's amendment: triton | torch | official).
# A suite = the cells run on every listed dataset × its dims. `algos` maps each algo to the
# backends it runs on (one per algo since 2026-09-16, see below); algos.PATHS drops
# (algo, filter_kind, backend) triples with
# no code path (linr_v2 on `none`, official on anything but silvertorch).
# `params.<algo>`: `build:` (rebuilds the index) and `query:` (n_probe / candidate_pool,
# mutated via set_query_params) — dict-of-lists = grid, list-of-dicts = explicit combos.
# Algo defaults when no params are given: silvertorch n_lists=1024 n_probe=24 n_iter=10,
# linr_v3 candidate_pool=5000 (the old configs' cells).

# `quality` (unfiltered) is RETIRED from the campaign, 2026-09-16 (user): the study's datasets
# are changing, and the suite's dataset list was stale anyway -- it still named yambda-500m and
# yambda-5b, which roadmap Phase E dropped from the study on 2026-09-05 ("scale without
# meaningful filters, closed query encoder; the existing Yambda unfiltered runs stay as they
# are"). The unfiltered cells come back with the Phase E datasets at E5, not from yambda.
# Consequence: report.py's `tab:recall_nofilter` has no source and emits its placeholder until
# then -- that is expected, not a defect.
#
# One backend per algo, decided 2026-09-16 (user) and by measurement, not by taste: an algo is
# a row in the paper, not an implementation matrix. `triton` wins on every algo we measured --
# eager median torch/triton 4.16x (v1), 7.27x (v2), 10.19x (v3), from D1-a's own records -- so
# every algo is pinned to it. The one deliberate deviation is `silvertorch`, which carries two
# implementations because *that comparison is the paper* (Triton reimplementation vs Meta's
# official kernels, gap G2). The `torch` floor is not swept: it is already banked in D1-a's 71
# records at d128 and is reported from there. `linr_v4` is dropped entirely -- it is ours, not
# LiNR's: the paper defines V1-V3 only (articles/linr.md, figures knn_v1..v3).
filter:                        # vs exact oracle + held-out-in-filter (old d*-filter.yaml)
  # yfcc10m joined 2026-09-16 (roadmap E1): one dim (192, its native CLIP width — the
  # d128 of the others is their chosen dim, not an ablation), one clause sweep, no bloom
  # (config/yfcc10m.yaml). ks are the suite's: recall is against the harness's own cosine
  # oracle, not the shipped k=10 squared-L2 GT (docs/system/datasets.md § yfcc10m).
  # `dims` is [128, 192] for that reason and is NOT the dim ablation, which stays dropped:
  # each dataset contributes exactly one width. pubmed joined at E2 at its native 768
  # (MedCPT, config/pubmed.yaml), same rule; openalex at E3 at its native 768
  # (nomic-embed-text-v1.5, config/openalex.yaml), a 10 M catalog like pubmed's.
  datasets: [goodreads, arxiv, yfcc10m, pubmed, openalex]
  dims: [128, 192, 768]
  filter_kinds: [clause, bloom]
  ks: [100, 500, 1000]
  batch_sizes: [1, 8, 16]
  algos:
    linr_v1_filter_mask: [triton]
    linr_v2: [triton]
    linr_v3: [triton]
    silvertorch: [triton, official]
  params:
    silvertorch: {query: {n_probe: [24, 32]}}   # roadmap D1: headline n_probe ∈ {24, 32}
  seeds:
    default: [0]
    headline: {sweeps: [c0_genre, c0_maincat, all4], dims: [128], seeds: [0, 1, 2]}

deep:                          # recall-vs-latency curves (old config/deep_sweeps/*.yaml + H §2.7)
  datasets: [goodreads, arxiv]
  dims: [128]
  filter_kinds: [clause, bloom]
  ks: [100, 200, 400]
  batch_sizes: [1, 8, 16]
  seeds: [0, 1, 2]
  algos:
    silvertorch: [triton, official]
    linr_v3: [triton]
  params:
    silvertorch:               # 2 builds (n_lists) × 6 query configs, not 12 builds (§8.2 A)
      build: {n_lists: [1664, 8192]}
      query: {n_probe: [4, 8, 24, 32, 128, 256]}
    linr_v3:
      query: {candidate_pool: [2000, 4000, 8000, 16000, 32000]}

bloom: {m_bits: 1024, k_hash: 5}   # shared defaults; a suite may override with its own `bloom:`
