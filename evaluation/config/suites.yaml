# Harness v2 suites, the campaign-v2 grid (user decisions 2026-10-08; docs/system/evaluation.md
# § Config). A suite = the cells run on every listed dataset at the dims both list. Each entry of
# `arms` is one algo on its backends, optionally narrowed to `filter_kinds` / `sweeps`, with
# `build:` (rebuilds the index) and `query:` (n_probe / candidate_pool / candidate_pool_frac /
# alpha, applied with set_query_params) grids. An arm with `datasets:` runs only on the datasets
# it lists, each with optional `build` / `query` / `sweeps` overrides merged over the arm's.
# algos.PATHS drops (algo, filter_kind, backend) triples with no code path. Algo defaults:
# silvertorch n_lists=1024 n_probe=24 n_iter=10, linr_v3 candidate_pool=5000.
#
# Global rules: seeds {0, 1, 2} everywhere (codesign: timing repeats); bs {1, 16}; k {100, 1000};
# no n_probe 4 / 256 (synth's SilverTorch sweep aside, user), no bs 8, no k 500, no openalex.
# Official SilverTorch runs `none` / `bloom` only: its clause cells time our pack_mask adapter
# (the old records stay readable). One backend per algo (`triton`, measured fastest everywhere)
# except silvertorch, whose official-vs-ours comparison is the paper, and the C3 torch arms
# named below.
#
# IVF-TUNE (docs/artifacts/campaign-v2/ivf-tune): SilverTorch's n_lists and n95 per dataset, where
# n95 = the smallest n_probe reaching recall_oracle@100 >= 0.95 on the dataset's median kept sweep.
# Tuned on goodreads (4096 / 64); arXiv (and YFCC's n_lists) by the size rule (n_lists ~ 4.6 sqrt(N), n95 =
# n_lists / 64), which holds at goodreads' pass rate (0.33) only: n95 / n_lists grows as the pass
# rate falls (PubMed all5, 0.018: > 1/16, recall 0.680 at 256 of 4096). PubMed's slot stays open
# until its tuning ends.

# Kept sweeps (one high pass rate, one low, one conjunctive / reverse), from measured pass rates:
# arxiv c3_nversions 0.444, c0_maincat 0.136, all4 0.0094; pubmed c0_mesh 0.0002,
# c3_journal_reverse 0.9993, all5 0.018. Bloom keeps the forward ones among them.
filter:                        # headline (T2, C3, C6)
  datasets: [goodreads, arxiv, yfcc10m, pubmed]
  dims: [128, 192, 768]        # each dataset's one native / chosen width; no dim ablation
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre, c1_lang_reverse, all4]
    arxiv: [c3_nversions, c0_maincat, all4]
    pubmed: [c0_mesh, c3_journal_reverse, all5]
    yfcc10m: [tags_and]
  interleave:                  # comparison groups, timed round-robin under --interleave
    - {by: algo, values: [linr_v1_filter_mask, linr_v2]}
    - {by: backend, values: [triton, official]}
  arms:
    - {algo: linr_v1_filter_mask, backends: [triton]}
    - {algo: linr_v2, backends: [triton]}
    - {algo: linr_v3, backends: [triton]}                     # candidate_pool 5000
    - algo: silvertorch
      backends: [triton]
      query: {n_probe: [24]}                                  # 24 = the paper's; n95 per dataset
      datasets:                                             # IVF-TUNE: n_lists by size, n_probe {24, n95}
        goodreads: {build: {n_lists: [4096]}, query: {n_probe: [24, 64]}}
        arxiv: {build: {n_lists: [8192]}, query: {n_probe: [24, 128]}}
        yfcc10m: {build: {n_lists: [16384]}}   # n95 open: the rule says 256 (grid rule: no 256); pass rate ~ PubMed's
        pubmed: {}   # IVF-TUNE PubMed pending
    - algo: silvertorch
      backends: [official]
      filter_kinds: [bloom]
      query: {n_probe: [24]}                                  # 24 = the paper's; n95 per dataset
      datasets:                                             # IVF-TUNE: n_lists by size, n_probe {24, n95}
        goodreads: {build: {n_lists: [4096]}, query: {n_probe: [24, 64]}}
        arxiv: {build: {n_lists: [8192]}, query: {n_probe: [24, 128]}}
        yfcc10m: {build: {n_lists: [16384]}}   # n95 open: the rule says 256 (grid rule: no 256); pass rate ~ PubMed's
        pubmed: {}   # IVF-TUNE PubMed pending
    # C3's torch arms on goodreads + arxiv only (measured: 515-917 s a cell at 0.8 M; the 10 M
    # catalogs would take hours a cell); add yfcc10m / pubmed here if C3 stays ambiguous.
    - algo: silvertorch                                       # #12: plain-torch IVF
      backends: [torch]
      query: {n_probe: [24]}
      datasets: {goodreads: {build: {n_lists: [4096]}}, arxiv: {build: {n_lists: [8192]}}}   # the triton arm's index
    - algo: silvertorch                                       # #13: the same, torch.compile'd
      backends: [torch]
      build: {compile: [max-autotune]}
      query: {n_probe: [24]}
      datasets: {goodreads: {build: {n_lists: [4096]}}, arxiv: {build: {n_lists: [8192]}}}   # the triton arm's index
    - {algo: postfilter, backends: [torch], query: {alpha: [1, 8]}}   # the generic-torch baseline

deep:                          # recall-vs-latency Pareto (F3, C6)
  datasets: [goodreads, arxiv, yfcc10m]
  dims: [128, 192]
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre, c1_lang_reverse, all4]
    arxiv: [c3_nversions, c0_maincat, all4]
    yfcc10m: [tags_and]
  arms:
    - algo: silvertorch        # n_lists ~ sqrt(N) and 4x that
      backends: [triton]
      query: {n_probe: [8, 16, 32, 64, 128]}
      datasets:
        goodreads: {build: {n_lists: [1024, 4096]}}
        arxiv: {build: {n_lists: [1664, 8192]}}
        yfcc10m: {build: {n_lists: [4096, 16384]}}
    - algo: silvertorch
      backends: [official]
      filter_kinds: [bloom]
      query: {n_probe: [8, 16, 32, 64, 128]}
      datasets:
        goodreads: {build: {n_lists: [1024, 4096]}}
        arxiv: {build: {n_lists: [1664, 8192]}}
        yfcc10m: {build: {n_lists: [4096, 16384]}}
    - algo: linr_v3            # candidate_pool as a fraction of the sweep's mean passing items
      backends: [triton]
      query: {candidate_pool_frac: [0.005, 0.01, 0.02, 0.05, 0.1]}

synth:                         # pass rate as the x axis (F1, F2, C1, C2, C6)
  datasets: [goodreads-synth, arxiv-synth, yfcc10m-synth]
  dims: [128, 192]
  filter_kinds: [clause, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  ks_by_sweep:                 # k = 1000 dropped where N*p < 4*1000: "return every passing item"
    goodreads-synth: {p0001: [100], p0003: [100]}            # N 797,084
    arxiv-synth: {p0001: [100]}                              # N 2,988,996
  interleave:                  # V1 vs V2 per backend and compile mode; triton vs official bloom
    - {by: algo, values: [linr_v1_filter_mask, linr_v2]}
    - {by: backend, values: [triton, official]}
  arms:
    - {algo: linr_v1_filter_mask, backends: [triton]}
    - {algo: linr_v2, backends: [triton]}
    - {algo: linr_v3, backends: [triton], query: {candidate_pool_frac: [0.01, 0.05]}}
    - algo: silvertorch
      backends: [triton]
      filter_kinds: [clause]
      query: {n_probe: [24, 64, 128, 256, 512, 1024]}       # an explicit sweep, not n95 (user)
      datasets:                                             # n_lists from IVF-TUNE (real dataset's)
        goodreads-synth: {build: {n_lists: [4096]}}
        arxiv-synth: {build: {n_lists: [8192]}}
        yfcc10m-synth: {build: {n_lists: [16384]}, query: {n_probe: [24, 256, 1024]}}
    - algo: silvertorch
      backends: [triton]
      filter_kinds: [bloom]
      query: {n_probe: [24, 256]}
      datasets: {goodreads-synth: {build: {n_lists: [4096]}}, arxiv-synth: {build: {n_lists: [8192]}}, yfcc10m-synth: {build: {n_lists: [16384]}}}
    - algo: silvertorch
      backends: [official]
      filter_kinds: [bloom]
      query: {n_probe: [24, 256]}
      datasets: {goodreads-synth: {build: {n_lists: [4096]}}, arxiv-synth: {build: {n_lists: [8192]}}, yfcc10m-synth: {build: {n_lists: [16384]}}}
    - {algo: postfilter, backends: [torch], query: {alpha: [1, 8]}}
    # C3 (native torch vs our kernels) as a function of p, eager and compiled; goodreads + arxiv
    # only, like filter's torch arms (add yfcc10m-synth: {} if C3 stays ambiguous)
    - algo: linr_v1_filter_mask
      backends: [torch]
      sweeps: [p001, p01, p1]
      datasets: {goodreads-synth: {}, arxiv-synth: {}}
    - algo: linr_v2
      backends: [torch]
      sweeps: [p001, p01, p1]
      datasets: {goodreads-synth: {}, arxiv-synth: {}}
    - algo: linr_v1_filter_mask
      backends: [torch]
      sweeps: [p001, p01, p1]
      build: {compile: [max-autotune]}
      datasets: {goodreads-synth: {}, arxiv-synth: {}}
    - algo: linr_v2
      backends: [torch]
      sweeps: [p001, p01, p1]
      build: {compile: [max-autotune]}
      datasets: {goodreads-synth: {}, arxiv-synth: {}}


codesign:                      # S9 / F4b, C5: the official bloom path, partial vs full masks
  # `bloom_path` exists on silvertorch / bloom / official only (anything else is a ConfigError);
  # both arms carry it in `params`, so their keys never collide with filter / deep official cells.
  datasets: [arxiv, goodreads]
  dims: [128]
  filter_kinds: [bloom]
  ks: [100]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2]
  sweeps:
    arxiv: [c3_nversions, c0_maincat, all4]
    goodreads: [c0_genre, c2_format, c3_year]
  interleave: [{by: bloom_path}]   # partial vs full, timed round-robin under --interleave
  arms:
    - algo: silvertorch
      backends: [official]
      build: {bloom_path: [partial, full]}
      query: {n_probe: [8, 32, 128]}
      datasets:
        arxiv: {build: {n_lists: [1664]}}
        goodreads: {build: {n_lists: [1024]}}

h2h:                           # H2H-final / T3, C7: official vs our Triton on the release code
  # Run with --interleave --profile: one group of the three arms per cell, timed round-robin, and
  # the kernel-only split. `score_path` is a build param of silvertorch / official only (fp16 is
  # the library default the paper reports, int32 the bit-exact parity path). Seeds are repeats.
  datasets: [goodreads, arxiv]
  dims: [128]
  filter_kinds: [none, bloom]
  ks: [100, 1000]
  batch_sizes: [1, 16]
  seeds: [0, 1, 2, 3, 4]
  sweeps:
    goodreads: [c0_genre]      # the b3 / kernel-opt cell
    arxiv: [c0_maincat]        # its median kept sweep
  interleave: [{by: [backend, score_path]}]
  arms:
    - {algo: silvertorch, backends: [triton], query: {n_probe: [24]}}
    - algo: silvertorch
      backends: [official]
      build: {score_path: [fp16, int32]}
      query: {n_probe: [24]}

bloomwidth:                    # D3 / F4a, C4: bloom width vs FPR and recall
  perf: false
  datasets: [goodreads, arxiv, pubmed]
  dims: [128, 768]
  filter_kinds: [bloom]
  ks: [100, 1000]
  batch_sizes: [16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre]
    arxiv: [c3_nversions, c0_maincat, all4]
    pubmed: [c0_mesh]          # multi-valued (K = 4)
  arms:
    - algo: silvertorch
      backends: [triton]
      build: {m_bits: [64, 128, 256, 512, 1024, 2048], k_hash: [3, 5]}
    # official ignores m_bits: its bloom width is OfficialConfig.b_multiplier (measured: the
    # same index_mib and recall at 64 and 2048 bits), so only k_hash (its search k) is gridded
    - {algo: silvertorch, backends: [official], build: {k_hash: [3, 5]}}

bloomwidth-timed:              # one timed point per width
  datasets: [goodreads, arxiv, pubmed]
  dims: [128, 768]
  filter_kinds: [bloom]
  ks: [100]
  batch_sizes: [16]
  seeds: [0, 1, 2]
  sweeps:
    goodreads: [c0_genre]
    arxiv: [c3_nversions, c0_maincat, all4]
    pubmed: [c0_mesh]
  arms:
    - algo: silvertorch
      backends: [triton]
      build: {m_bits: [64, 128, 256, 512, 1024, 2048], k_hash: [5]}
    - {algo: silvertorch, backends: [official], build: {k_hash: [5]}}   # its one width

bloom: {m_bits: 1024, k_hash: 5}   # shared defaults; a suite may override with its own `bloom:`
