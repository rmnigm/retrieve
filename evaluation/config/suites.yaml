# sweep, bloom partial path, eager over eager (official is not capturable); run with --interleave --profile.
c7-scorepath:
  datasets: [laion30m]
  dims: [256]
  filter_kinds: [bloom]
  ks: [100]
  batch_sizes: [16, 64]
