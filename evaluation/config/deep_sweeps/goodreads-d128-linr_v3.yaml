_defaults: &defaults
  data_dir: data/goodreads-work-id
  output: results/deep_sweeps/goodreads-d128-linr_v3
  # Share the d128 oracle cache with config/goodreads/d128-filter.yaml — same
  # checkpoint, same item_embs. Per-dim slot to avoid colliding with d64/d256
  # under the shared data_dir.
  gt_subdir: gt_d128
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 8, 16]
  seed: 0
  users_limit: 10000
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200

  # linr_v3-only param sweep — companion to the main filter configs which
  # carry a single canonical `candidate_pool`. This config traces the
  # recall-vs-latency curve across multiple candidate_pool sizes on the
  # goodreads d128 SASRec checkpoint.
  algorithms:
    - linr_v3

  backends: [triton, torch]

  algo_params:
    linr_v3:
      # Candidate-pool sweep — small pool = fast but lossy stage-1, large
      # pool = approaches the exact baseline at higher cost.
      - {candidate_pool: 2000,  v3_seed: 0}
      - {candidate_pool: 4000,  v3_seed: 0}
      - {candidate_pool: 8000,  v3_seed: 0}
      - {candidate_pool: 16000, v3_seed: 0}
      - {candidate_pool: 32000, v3_seed: 0}

  filters:
    clause:
      attrs_path:    data/goodreads-work-id/item_attrs_narrow.pt
      reverse_path:  data/goodreads-work-id/clause_is_reverse_narrow.pt
      sweeps:
        - {name: c0_genre,        active_clauses: [0]}
        - {name: c1_lang_reverse, active_clauses: [1]}
        - {name: c2_format,       active_clauses: [2]}
        - {name: c3_year,         active_clauses: [3]}
        - {name: c0c1,            active_clauses: [0, 1]}
        - {name: all4,            active_clauses: [0, 1, 2, 3]}
    bloom:
      # Bloom over the SAME narrow attrs; reverse-clause sweeps omitted
      # (BloomFilter is forward-only).
      attrs_path:   data/goodreads-work-id/item_attrs_narrow.pt
      reverse_path: data/goodreads-work-id/clause_is_reverse_narrow.pt
      m_bits: 1024
      k_hash: 5
      sweeps:
        - {name: c0_genre, active_clauses: [0]}
        - {name: c2_format, active_clauses: [2]}
        - {name: c3_year,  active_clauses: [3]}

<<: *defaults
checkpoint: data/goodreads-work-id/checkpoints/gsasrec-d128-drop0.5-id/best_model.pt
