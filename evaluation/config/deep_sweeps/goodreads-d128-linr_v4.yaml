_defaults: &defaults
  data_dir: data/goodreads-work-id
  output: results/deep_sweeps/goodreads-d128-linr_v4
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 8, 16]
  seed: 0
  users_limit: 10000
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200

  # linr_v4 is parameter-free (single-stage int8 dense + optional mask),
  # so this config just runs it alongside the existing v1/v3 baselines
  # under every filter regime on goodreads d128.
  algorithms:
    - linr_v1_filter_mask
    - linr_v3
    - linr_v4

  backends: [triton, torch]

  algo_params:
    linr_v3:
      - {candidate_pool: 8000, v3_seed: 0}
    linr_v4:
      - {}

  filters:
    clause:
      attrs_path:    data/goodreads-work-id/item_attrs_narrow.pt
      reverse_path:  data/goodreads-work-id/clause_is_reverse_narrow.pt
      sweeps:
        - {name: c0_genre,        active_clauses: [0]}
        - {name: c1_lang_reverse, active_clauses: [1]}
        - {name: c2_format,       active_clauses: [2]}
        - {name: c3_year,         active_clauses: [3]}
        - {name: c0c1,            active_clauses: [0, 1]}
        - {name: all4,            active_clauses: [0, 1, 2, 3]}
    bloom:
      attrs_path:   data/goodreads-work-id/item_attrs_narrow.pt
      reverse_path: data/goodreads-work-id/clause_is_reverse_narrow.pt
      m_bits: 1024
      k_hash: 5
      sweeps:
        - {name: c0_genre, active_clauses: [0]}
        - {name: c2_format, active_clauses: [2]}
        - {name: c3_year,  active_clauses: [3]}

<<: *defaults
checkpoint: data/goodreads-work-id/checkpoints/gsasrec-d128-drop0.5-id/best_model.pt
