_defaults: &defaults
  data_dir: data/yambda/5b-listens-plus
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 500]
  batch_sizes: [1, 4, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_fullscan
    - triton_knn
    - linr_v3_then_v2
    - silvertorch
  # 5B Listen+ catalog is order-of-magnitude larger than 500M; clustering knobs
  # tuned to ~sqrt(N) heuristic with N assumed mid-tens-of-millions. Sweep
  # ranges scaled up accordingly. List-valued entries become sweep axes
  # (cartesian product); scalars stay fixed. Invalid silvertorch combos
  # (n_probe > n_lists) are skipped with a warning.
  algo_params:
    linr_v3_then_v2:
      candidate_pool: [1000, 2500, 5000, 10000]
      v3_seed: 0
    silvertorch:
      n_lists: [2048, 4096, 8192, 16384]
      n_probe: [16, 32, 64, 128]
      n_iter: 10
      seed: 0

<<: *defaults
checkpoint: checkpoints/gsasrec-5b-listens-d128/best_model.pt
