_defaults: &defaults
  data_dir: data/yambda/5b-listens-plus
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 500]
  batch_sizes: [1, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_fullscan
    - triton_knn
    - linr_v3_then_v2
    - silvertorch
    - faiss_flat_ip
    - faiss_ivf_flat
  # 5B Listen+ catalog is order-of-magnitude larger than 500M; clustering knobs
  # tuned to ~sqrt(N) heuristic with N assumed mid-tens-of-millions. Re-tune
  # after first run once exact `num_items` is known (`item_id_map.json`).
  algo_params:
    linr_v3_then_v2: { candidate_pool: 5000, v3_seed: 0 }
    silvertorch:     { n_lists: 4096, n_probe: 32, n_iter: 10, seed: 0 }
    faiss_ivf_flat:  { nlist: 8192, nprobe: 32, seed: 0 }

<<: *defaults
checkpoint: checkpoints/gsasrec-5b-listens-d128/best_model.pt
