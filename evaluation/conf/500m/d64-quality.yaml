_defaults: &defaults
  data_dir: data/yambda-500m
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 4, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_knn
    - triton_knn
    - linr_v3
    - silvertorch
    - voyager_hnsw
  # N≈1.87M → sqrt(N)≈1366. Each algo's params block is a list of dicts;
  # each dict is one explicit (n_lists, n_probe) combo. Sweep is the
  # cross of linr_v3 × silvertorch params.
  algo_params:
    linr_v3:
      - {candidate_pool: 1000, v3_seed: 0}
      - {candidate_pool: 2500, v3_seed: 0}
      - {candidate_pool: 5000, v3_seed: 0}
      - {candidate_pool: 10000, v3_seed: 0}
    silvertorch:
      - {n_lists: 512, n_probe: 16, n_iter: 10, seed: 0}
      - {n_lists: 512, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 512, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 1024, n_probe: 16, n_iter: 10, seed: 0}
      - {n_lists: 1024, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 1024, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 2048, n_probe: 16, n_iter: 10, seed: 0}
      - {n_lists: 2048, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 2048, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 4096, n_probe: 16, n_iter: 10, seed: 0}
      - {n_lists: 4096, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 4096, n_probe: 64, n_iter: 10, seed: 0}
    voyager_hnsw:
      - {m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0}

<<: *defaults
checkpoint: data/yambda-500m/checkpoints/gsasrec-d64-drop0.5/best_model.pt
