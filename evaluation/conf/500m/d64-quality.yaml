_defaults: &defaults
  data_dir: data/yambda-500m
  output: results/yambda/500m-d64.json
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 4, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_knn
    - triton_knn
    - linr_v3
    - silvertorch
  # N≈1.87M → sqrt(N)≈1366. Each algo's params block is a list of dicts;
  # each dict is one explicit (n_lists, n_probe) combo. Sweep is the
  # cross of linr_v3 × silvertorch params.
  algo_params:
    linr_v3:
      - {candidate_pool: 1000, v3_seed: 0}
      - {candidate_pool: 2500, v3_seed: 0}
      - {candidate_pool: 5000, v3_seed: 0}
      - {candidate_pool: 10000, v3_seed: 0}
    silvertorch:
      # Recall curve — Layout A (n_lists≈√N, paper-faithful, ~1700-item clusters).
      - {n_lists: 1024, n_probe: 8,   n_iter: 10, seed: 0}  # P≈14k
      - {n_lists: 1024, n_probe: 32,  n_iter: 10, seed: 0}  # P≈53k
      - {n_lists: 1024, n_probe: 128, n_iter: 10, seed: 0}  # P≈213k
      # CUDA-friendly point — Layout B (n_lists=4096, ~415-item clusters).
      - {n_lists: 4096, n_probe: 8,   n_iter: 10, seed: 0}  # P≈3.3k

<<: *defaults
checkpoint: data/yambda-500m/checkpoints/gsasrec-d64-drop0.5/best_model.pt
