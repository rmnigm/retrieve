_defaults: &defaults
  data_dir: data/yambda/500m-listens
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 500]
  batch_sizes: [1, 4, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_knn
    - triton_knn
    - linr_v3
    - silvertorch
    - voyager_hnsw
  # N≈1.87M → sqrt(N)≈1366. List-valued entries become sweep axes (cartesian
  # product); scalars stay fixed. Invalid silvertorch combos (n_probe > n_lists)
  # are skipped with a warning.
  algo_params:
    linr_v3:
      candidate_pool: [1000, 2500, 5000, 10000]
      v3_seed: 0
    silvertorch:
      n_lists: [256, 512, 1024, 2048, 4096]
      n_probe: [8, 16, 32, 64]
      n_iter: 10
      seed: 0
    voyager_hnsw: { m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0 }

<<: *defaults
checkpoint: checkpoints/gsasrec-500m-listens-d256-drop0.5/best_model.pt
