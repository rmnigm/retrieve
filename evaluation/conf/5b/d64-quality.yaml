_defaults: &defaults
  data_dir: data/yambda-5b
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 4, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_knn
    - triton_knn
    - linr_v3
    - silvertorch
  # 5B Listen+ catalog is order-of-magnitude larger than 500M; clustering knobs
  # tuned to ~sqrt(N) heuristic with N assumed mid-tens-of-millions. Sweep
  # ranges scaled up accordingly. Each algo's params block is a list of
  # dicts; each dict is one explicit (n_lists, n_probe) combo.
  algo_params:
    linr_v3:
      - {candidate_pool: 1000, v3_seed: 0}
      - {candidate_pool: 2500, v3_seed: 0}
      - {candidate_pool: 5000, v3_seed: 0}
      - {candidate_pool: 10000, v3_seed: 0}
    silvertorch:
      - {n_lists: 4096, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 4096, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 4096, n_probe: 128, n_iter: 10, seed: 0}
      - {n_lists: 8192, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 8192, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 8192, n_probe: 128, n_iter: 10, seed: 0}
      - {n_lists: 16384, n_probe: 32, n_iter: 10, seed: 0}
      - {n_lists: 16384, n_probe: 64, n_iter: 10, seed: 0}
      - {n_lists: 16384, n_probe: 128, n_iter: 10, seed: 0}

<<: *defaults
checkpoint: data/yambda-5b/checkpoints/gsasrec-d64/best_model.pt
