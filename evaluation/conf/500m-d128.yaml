_defaults: &defaults
  data_dir: data/yambda/500m-listens
  output: null                # null → <ckpt-dir>/benchmark.json
  split: test
  device: cuda
  ks: [100, 500]
  batch_sizes: [1, 8, 16]
  seed: 0
  encode:
    batch_size: 512
    num_workers: 8
    max_seq_length: 200
  algorithms:
    - torch_fullscan
    - triton_knn
    - linr_v3_then_v2
    - silvertorch
    - voyager_hnsw
  # N≈1.87M → sqrt(N)≈1366. 1024 lists × ~1825 items/cluster avg.
  # n_probe=16 visits ~29K items per query (~1.6% of N).
  algo_params:
    linr_v3_then_v2: { candidate_pool: 5000, v3_seed: 0 }
    silvertorch:     { n_lists: 1024, n_probe: 16, n_iter: 10, seed: 0 }
    voyager_hnsw:    { m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0 }

<<: *defaults
checkpoint: checkpoints/gsasrec-500m-listens-d128-drop0.5/best_model.pt
