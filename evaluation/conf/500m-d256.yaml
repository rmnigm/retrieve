checkpoint: checkpoints/gsasrec-500m-listens-d256-drop0.5/best_model.pt
data_dir: data/yambda/500m-listens
output: null                  # null → <ckpt-dir>/eval_yambda_retrieval.json
split: test
device: cuda
ks: [100, 500]

encode:
  batch_size: 512
  num_workers: 8
  max_seq_length: 200

algorithms:
  - torch_fullscan
  - triton_knn
  - linr_v3_then_v2
  - silvertorch

# N=1.87M → sqrt(N)≈1366; 1024 lists × ~1825 items/cluster avg.
# n_probe=16 visits ~29K items per query (~1.6% of N).
algo_params:
  linr_v3_then_v2:
    candidate_pool: 5000
    v3_seed: 0
  silvertorch:
    n_lists: 1024
    n_probe: 16
    n_iter: 10
    seed: 0
