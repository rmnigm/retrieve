data_dir: data/arxiv-papers
# No content_subdir/gt_subdir — d=256 uses the default `content` / `gt` paths.
# No `checkpoint:` — arxiv queries are pre-encoded; loader reads
# data/arxiv-papers/content/query_emb.pt directly. Device is cpu because
# nothing in the voyager path needs CUDA when queries are on disk.
output: results/voyager/arxiv-d256.json
split: test
device: cpu
ks: [100, 200, 400]
seed: 0
algo_params:
  voyager_hnsw:
    - {m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0}
