data_dir: data/arxiv-papers
content_subdir: content_d64
gt_subdir: gt_d64
# No `checkpoint:` — arxiv queries are pre-encoded; loader reads
# data/arxiv-papers/content_d64/query_emb.pt directly. Device is cpu because
# nothing in the voyager path needs CUDA when queries are on disk.
output: results/voyager/arxiv-d64.json
split: test
device: cpu
ks: [100, 200, 400]
seed: 0
algo_params:
  voyager_hnsw:
    - {m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0}
