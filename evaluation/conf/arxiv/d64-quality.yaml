_defaults: &defaults
  data_dir: data/arxiv-papers
  content_subdir: content_d64
  gt_subdir: gt_d64
  # No `checkpoint:` field — arxiv has no SASRec model; queries come from
  # data/arxiv-papers/content_d64/query_emb.pt (built by `arxiv.py encode_queries`).
  output: data/arxiv-papers/evaluate_quality_d64.json
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 8, 16]
  seed: 0

  algorithms:
    - torch_knn
    - linr_v3
    - silvertorch
    - voyager_hnsw

  algo_params:
    linr_v3:
      - {candidate_pool: 12000, v3_seed: 0}
    silvertorch:
      - {n_lists: 1664, n_probe: 32, n_iter: 10, m_bits: 1024, k_hash: 5, seed: 0}
    voyager_hnsw:
      - {m: 32, ef_construction: 200, ef_query: 1000, num_threads: 16, seed: 0}

<<: *defaults
