_defaults: &defaults
  data_dir: data/arxiv-papers
  # No `checkpoint:` field — arxiv has no SASRec model; queries come from
  # data/arxiv-papers/content/query_emb.pt (built by `arxiv.py encode_queries`).
  output: results/arxiv/d256-filter.json
  split: test
  device: cuda
  ks: [100, 200, 400]
  batch_sizes: [1, 8, 16]
  seed: 0

  algorithms:
    - linr_v1_filter_mask
    - linr_v3
    - silvertorch          # auto-skipped on filter_kind=clause; runs on bloom sweeps only

  algo_params:
    linr_v3:
      - {candidate_pool: 12000, v3_seed: 0}
    # Several explicit silvertorch configs — same n_lists, varying n_probe
    # to map the recall-vs-latency curve on narrow predicates (all4 drops
    # hardest at low n_probe).
    silvertorch:
      # Recall curve — Layout A (n_lists≈√N, paper-faithful, ~1800-item clusters).
      - {n_lists: 1664, n_probe: 8,   n_iter: 10, m_bits: 1024, k_hash: 5, seed: 0}  # P≈14k, recall≈0.74
      - {n_lists: 1664, n_probe: 32,  n_iter: 10, m_bits: 1024, k_hash: 5, seed: 0}  # P≈58k, recall≈0.89
      - {n_lists: 1664, n_probe: 128, n_iter: 10, m_bits: 1024, k_hash: 5, seed: 0}  # P≈232k, recall≈0.95
      # CUDA-friendly point — Layout B (n_lists=8192, ~365-item clusters).
      - {n_lists: 8192, n_probe: 8,   n_iter: 10, m_bits: 1024, k_hash: 5, seed: 0}  # P≈2.6k

  filters:
    clause:
      attrs_path:    data/arxiv-papers/item_attrs_narrow.pt
      reverse_path:  data/arxiv-papers/clause_is_reverse_narrow.pt
      sweeps:
        - {name: c0_maincat,    active_clauses: [0]}
        - {name: c2_year,       active_clauses: [2]}
        - {name: c3_nversions,  active_clauses: [3]}
        - {name: c0c2,          active_clauses: [0, 2]}
        - {name: all4,          active_clauses: [0, 1, 2, 3]}
    bloom:
      # Bloom over the SAME narrow attrs as the clause sweeps — paper-strict
      # set-membership approximation of the exact-equality predicate.
      # All arxiv clauses are forward (no reverse), so every active set is
      # bloom-eligible.
      attrs_path:   data/arxiv-papers/item_attrs_narrow.pt
      reverse_path: data/arxiv-papers/clause_is_reverse_narrow.pt
      m_bits: 1024
      k_hash: 5
      sweeps:
        - {name: c0_maincat,    active_clauses: [0]}
        - {name: c2_year,       active_clauses: [2]}
        - {name: c3_nversions,  active_clauses: [3]}
        - {name: c0c2,          active_clauses: [0, 2]}
        - {name: all4,          active_clauses: [0, 1, 2, 3]}

<<: *defaults
