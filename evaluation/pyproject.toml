[project]
name = "retrieve-evaluation"
version = "0.1.0"
description = "Training and evaluation for retrieve framework"
requires-python = ">=3.10"
dependencies = [
    "retrieve",
    "torch>=2.4,<3",
    "polars>=1.0",
    "pyarrow>=15",
    "tqdm>=4.66",
    "click>=8.1",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "wandb>=0.16",
    "sentence-transformers>=3.0",
]

[project.scripts]
evaluate                = "retrieval.cli.evaluate:main"
run-evaluation          = "retrieval.cli.run_evaluation:main"
stage-results           = "retrieval.cli.stage_results:main"
upload-results          = "retrieval.cli.upload_results:main"
yambda                  = "eval_datasets.yambda:main"
arxiv                   = "eval_datasets.arxiv:main"
goodreads               = "eval_datasets.goodreads:main"
pubmed                  = "eval_datasets.pubmed:main"
upload-checkpoints      = "training.upload_checkpoints:main"
eval-fetch              = "eval_datasets.hf_io:fetch_cli"
eval-publish            = "eval_datasets.hf_io:publish_cli"
eval-publish-checkpoint = "eval_datasets.hf_io:publish_checkpoint_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eval_datasets", "retrieval", "training"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
retrieve = { workspace = true }
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["eval_datasets", "training", "retrieval", "retrieve"]
