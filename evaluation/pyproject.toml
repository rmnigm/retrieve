[project]
name = "retrieve-evaluation"
version = "0.1.0"
description = "Training and evaluation for retrieve framework"
requires-python = ">=3.10"
dependencies = [
    "retrieve",
    "click>=8.1",
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "numpy>=1.26",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "torch>=2.4,<3",
    "torchvision>=0.19,<1",
    "tqdm>=4.66",
    "wandb>=0.16",
    "voyager>=2.1.0",
    "sentence-transformers>=3.0",
    "einops>=0.7",
]

[project.scripts]
evaluate                = "retrieval.evaluate:main"
yambda                  = "data.yambda:main"
arxiv                   = "data.arxiv:main"
goodreads               = "data.goodreads:main"
upload-checkpoints      = "training.upload_checkpoints:main"
eval-fetch              = "data.hf_io:fetch_cli"
eval-publish            = "data.hf_io:publish_cli"
eval-publish-checkpoint = "data.hf_io:publish_checkpoint_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "retrieval", "training"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
retrieve = { workspace = true }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["data", "training", "retrieval", "retrieve"]
