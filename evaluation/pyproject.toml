[project]
name = "retrieve-evaluation"
version = "0.1.0"
description = "Training and evaluation for retrieve framework"
requires-python = ">=3.10"
dependencies = [
    "retrieve",
    "click>=8.1",
    "datasets>=3.0",
    "huggingface-hub>=0.24",
    "loguru>=0.7",
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "torch>=2.4,<3",
    "tqdm>=4.66",
    "wandb>=0.16",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
retrieve = { path = "../retrieve", editable = true }
torch = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["data", "training", "retrieval", "retrieve"]
