[project]
name = "silvertorch-fork"
version = "1.0.0"
description = "SilverTorch: GPU Retrieval Library (retrieve's fork of meta-recsys/silvertorch @ 21aa35e)"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["torch>=2.0"]

[build-system]
requires = ["setuptools>=61", "wheel", "torch>=2.0"]
build-backend = "setuptools.build_meta"
