[project]
name = "retrieve"
version = "0.1.0"
description = "GPU Retrieval with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "torch>=2.4,<3",
    "triton>=3.0",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["retrieve"]

[tool.ruff.lint.per-file-ignores]
# Triton kernel launches use `grid = lambda meta: (...)` — the canonical form
# from Triton's own tutorials; `meta` is the autotuned config.
"src/retrieve/kernels/triton/**/*.py" = ["E731"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "setuptools>=82.0.1",
]
