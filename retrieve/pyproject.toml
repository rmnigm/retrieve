[project]
name = "retrieve"
version = "0.1.0"
description = "GPU Retrieval with PyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "torch>=2.4,<3",
    "triton>=3.0",
]

[project.optional-dependencies]
# Meta's official SilverTorch ops (torch.ops.st.*), the reference backend for
# Algorithm 1 phases 2+3. Pinned to a git sha in the workspace root's
# [tool.uv.sources]; not on PyPI. Building it needs nvcc + ninja + setuptools.
official = [
    "silvertorch",
]

[project.scripts]
tune-kernels = "retrieve.tune:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrieve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["retrieve"]

[tool.ruff.lint.per-file-ignores]
# Triton kernel launches use `grid = lambda meta: (...)` — the canonical form
# from Triton's own tutorials; `meta` is the autotuned config.
"src/retrieve/kernels/**/*.py" = ["E731"]

[dependency-groups]
dev = [
    "ninja>=1.11",
    "pytest>=9.0.3",
    "setuptools>=82.0.1",
]
