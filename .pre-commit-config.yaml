repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--select, I, --fix]
        files: ^retrieve/
      - id: ruff-format
        files: ^retrieve/

  - repo: local
    hooks:
      - id: check-doc-links
        name: check relative markdown links resolve
        entry: python3 scripts/check_doc_links.py
        language: system
        files: \.md$
        pass_filenames: false
