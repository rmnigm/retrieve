repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.6  # = the ruff pin in pyproject.toml's dev group; bump both together
    hooks:
      - id: ruff-check
        files: ^(retrieve|evaluation)/
      # evaluation/ joins once its formatting-only commit lands; it does not pass today.
      - id: ruff-format
        files: ^retrieve/

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]  # raw outputs live on the Hub (docs/system/evaluation.md)
      # Frozen or recorded bytes are never rewritten: the papers, raw artifacts, the golden cells.
      - id: end-of-file-fixer
        exclude: ^(articles|docs/artifacts|evaluation/golden)/
      - id: trailing-whitespace
        exclude: ^(articles|docs/artifacts|evaluation/golden)/

  - repo: local
    hooks:
      - id: check-doc-links
        name: check doc links, repo paths and CLI subcommands
        entry: python3 scripts/check_doc_links.py
        language: system
        files: \.(md|py)$
        pass_filenames: false
