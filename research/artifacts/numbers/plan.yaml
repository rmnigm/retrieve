# NUMBERS leg plan (controller brief .chains/numbers/2026-10-11-173000000-go.md; grid: results-draft grid plan items 1-8, 10;
# D-a recall 0.90 / 0.95; D-b n_lists {4096, 16384, 65536} at PubMed / YFCC / LAION 10 M / LAION 30 M). README.md explains.
#
# Conventions for every leg (runners):
#   CFG     = $OUT/config, made by: research/artifacts/numbers/prep_config.sh $TREE $OUT/config   (from a dev/numbers checkout)
#   RUN     = CUDA_VISIBLE_DEVICES=$GPU TORCHINDUCTOR_CACHE_DIR=/scratch/numbers/inductor-$BOX-$GPU
#             uv run --directory $TREE/evaluation bench run --config-dir $OUT/config --out $OUT
#   OUT     = /scratch/numbers/<leg>   (one per leg; never shared between GPUs)
#   before the first leg on a box: `bench check --dataset <ds>` for every dataset of its queue
#   upload  = docs/artifacts/campaign-final/pod1/upload_leg.sh-style: cp -al the leg's records into $T/<suite>,
#             bench upload --results $T --path-in-repo numbers/<leg> --verify; check MANIFEST n_records and code_versions
#   trees   = linr: the campaign-final worktree + its venv (library e16512f5)
#             fork: a worktree at FORK_HEAD (fork-coder's coder-done sha on dev/meta-fork) + venv with silvertorch-fork built -O3
#                   from that sha (docs/artifacts/meta-fork/build.sh); env.official_fork_build recorded by the harness
# est_gpu_h: from campaign-final elapsed_s / build_s and campaign-v2.9/laion30m-tune (results-draft grid plan), +20 % not included.

trees:
  linr: {worktree: campaign-final, library: e16512f5}
  fork: {worktree: FORK_HEAD, note: "set when fork-coder posts its coder-done sha; adapted legs wait for it"}

gpus: [d0, d1, p1]          # pod d GPU 0, pod d GPU 1, pod 1 GPU 0; pod b (b0) joins after fork-coder's done note
queues:                     # LiNR-only legs first; ends balanced at ~15-16 GPU-h each
  d0: [L2-v3pool, L2b-v3pool-laion, A1-laion30m, A2-laion30m-real]
  d1: [L1-linr-bs64, A0-k1000-check, A1-laion10m, A2-laion10m, A2-yfcc]
  p1: [L1b-linr-bs64-laion, L3-linr-corr, L4-linr-k2048, A1-small, A1-pubmed, A1-yfcc, A2-small, A1b-laion-small-lists, A2b-laion-small-lists, A2-pubmed, A3-st-k2048]
  b0: [A1-laion30m-synth, A2-laion30m-synth]   # controller 2026-10-11 19:10Z: A1-laion30m-synth moved from d1 (unless laion had started it)

legs:
  # ---------------- LiNR-only (start now, tree linr) ----------------
  - id: L1-linr-bs64
    item: 6
    tree: linr
    depends_on: none
    cmds:
      - "RUN --suite n-linr-bs64 --interleave --dataset {ds}   # ds in goodreads, arxiv, pubmed, yfcc10m"
    upload: numbers/L1-linr-bs64
    est_gpu_h: 3.0
  - id: L1b-linr-bs64-laion
    item: 6
    tree: linr
    depends_on: none
    cmds:
      - "RUN --suite n-linr-bs64-laion --interleave --dataset {ds}   # ds in laion1m, laion3m, laion10m, laion30m"
    upload: numbers/L1b-linr-bs64-laion
    est_gpu_h: 0.7
  - id: L2-v3pool
    item: 7
    tree: linr
    depends_on: none
    cmds:
      - "RUN --suite n-v3pool --dataset {ds}   # ds in goodreads, arxiv, pubmed, yfcc10m"
    upload: numbers/L2-v3pool
    est_gpu_h: 3.0
  - id: L2b-v3pool-laion
    item: 7
    tree: linr
    depends_on: none
    cmds:
      - "RUN --suite n-v3pool-laion --dataset {ds}   # ds in laion1m, laion3m, laion10m, laion30m"
    upload: numbers/L2b-v3pool-laion
    est_gpu_h: 2.0
  - id: L3-linr-corr
    item: 8
    tree: linr
    depends_on: none
    cmds: ["RUN --suite n-linr-corr --interleave --dataset arxiv-corr-synth"]
    upload: numbers/L3-linr-corr
    est_gpu_h: 0.1
  - id: L4-linr-k2048
    item: 10
    tree: linr
    depends_on: none
    cmds: ["RUN --suite n-linr-k2048 --interleave --dataset {ds}   # ds in goodreads, arxiv, pubmed"]
    upload: numbers/L4-linr-k2048
    est_gpu_h: 0.5

  # ---------------- adapted official SilverTorch (tree fork, at FORK_HEAD) ----------------
  - id: A0-k1000-check
    item: 2
    tree: fork
    depends_on: FORK_HEAD
    cmds: ["RUN --suite n-k1000-check --dataset {ds}   # ds in yfcc10m, laion30m"]
    decides: "every record ok at k 1000 -> the big A1 legs run n-curve-q-all; any failure -> they run n-curve-q, then n-curve-q-wide --k 100 (report the failure verbatim)"
    upload: numbers/A0-k1000-check
    est_gpu_h: 0.4
  - id: A1-small
    item: [1, 3, 4, 8]
    tree: fork
    depends_on: FORK_HEAD
    cmds: ["RUN --suite n-curve-q --dataset {ds}   # goodreads, goodreads-synth, arxiv, arxiv-synth, arxiv-corr-synth, laion1m, laion1m-synth, laion3m, laion3m-synth"]
    upload: numbers/A1-small
    est_gpu_h: 1.5
  - id: A1-pubmed
    item: [1, 2, 4]
    tree: fork
    depends_on: A0-k1000-check
    cmds: ["RUN --suite n-curve-q-all --dataset pubmed   # or n-curve-q + n-curve-q-wide --k 100 (A0)"]
    upload: numbers/A1-pubmed
    est_gpu_h: 1.6
  - id: A1-yfcc
    item: [1, 2]
    tree: fork
    depends_on: A0-k1000-check
    cmds:
      - "RUN --suite n-curve-q --dataset {ds}   # yfcc10m, yfcc10m-synth: done (numbers/A1-yfcc)"
      - "RUN --suite n-curve-q-yfcc-cap --dataset {ds}   # after A0 (--k 100 if A0 failed at k 1000): one quality-only point per filter, 16384 lists at the cap 4096; C6 evidence, never timed. No wide half, no 65536 (controller: YFCC is int8-capped)"
    upload: numbers/A1-yfcc
    est_gpu_h: 0.8
  - id: A1-laion10m
    item: [1, 2, 3, 4]
    tree: fork
    depends_on: A0-k1000-check
    cmds: ["RUN --suite n-curve-q-all --dataset {ds}   # laion10m, laion10m-synth (or the A0 fallback)"]
    upload: numbers/A1-laion10m
    est_gpu_h: 1.5
  - id: A1-laion30m
    item: [1, 2, 3, 4]
    tree: fork
    depends_on: A0-k1000-check
    cmds: ["RUN --suite n-curve-q-all --dataset laion30m   # or the A0 fallback; 65536-list builds ~30 min each"]
    upload: numbers/A1-laion30m
    est_gpu_h: 3.5
  - id: A1-laion30m-synth
    item: [1, 2, 3]
    tree: fork
    depends_on: A0-k1000-check
    cmds: ["RUN --suite n-curve-q-all --dataset laion30m-synth   # or the A0 fallback"]
    upload: numbers/A1-laion30m-synth
    est_gpu_h: 3.0
  # The timed legs need the picked points: after each A1 leg uploads, run (CPU, any box, dev/numbers checkout)
  #   bench fetch --path-in-repo numbers/<A1 leg> --results /scratch/numbers/fetch/<A1 leg>
  #   pick_points.py /scratch/numbers/fetch/*/**/results.parquet > research/artifacts/numbers/suites-timed.yaml   (all A1 legs so far)
  # commit suites-timed.yaml on dev/numbers, then prep_config.sh again for the A2 leg. results-draft does this on request.
  - id: A2-small
    item: [1, 3, 4, 5, 6]
    tree: fork
    depends_on: A1-small
    cmds:
      - "RUN --suite n-timed-d128 --interleave --dataset {ds}   # goodreads, goodreads-synth, arxiv, arxiv-synth, arxiv-corr-synth"
      - "RUN --suite n-timed-d256 --interleave --dataset {ds}   # laion1m, laion1m-synth, laion3m, laion3m-synth (not goodreads / arxiv: their d256 picks are not timed)"
    upload: numbers/A2-small
    est_gpu_h: 3.5
  # A1b / A2b (controller 2026-10-11, user "go bigger"): A1-small showed LAION 1 M / 3 M real filters below recall 0.90 at the cap with
  # n_lists 512 / 2048. More lists, then the C6 check of whether the ceiling is the int8 quantisation rather than the list count.
  - id: A1b-laion-small-lists
    item: [1, 3]
    tree: fork
    depends_on: A2-small
    cmds:
      - "RUN --suite n-curve-q-laion-small --dataset {ds}   # ds in laion1m (n_lists 4096, 8192), laion3m (8192, 16384); n_probe <= 1024"
      - "RUN --suite n-curve-q-laion-small-wide --dataset {ds}   # n_probe 2048 / 4096; add --k 100 if A0 failed at k 1000"
      - "cd $TREE/evaluation && CEIL_CFG=$OUT/config $VENV/bin/python ../docs/artifacts/campaign-v2.11/ceiling-int8-laion30m/ceiling_check.py {ds} n-ceil-laion-small {sw} {nl} {np} $OUT/ceil/ceiling-{ds}-{sw}.json   # (laion1m, 8192, 2048), (laion3m, 16384, 4096) x sw in c0_domain, tags4; shipped / per-row int8 / fp16 recall@100"
    upload: numbers/A1b-laion-small-lists   # records + ceil/*.json
    est_gpu_h: 0.5
  - id: A2b-laion-small-lists
    item: [1, 3, 5]
    tree: fork
    depends_on: A1b-laion-small-lists   # and a pick_points.py run over all A1 legs (results-draft)
    cmds:
      - "RUN --suite n-timed-d256 --interleave --force --dataset {ds}   # ds in laion1m, laion3m; --force so the new points and LiNR share one interleaved process"
    upload: numbers/A2b-laion-small-lists
    est_gpu_h: 0.8
  - id: A2-pubmed
    item: [1, 2, 4, 5, 6]
    tree: fork
    depends_on: A1-pubmed
    cmds: ["RUN --suite n-timed-d768 --interleave --dataset pubmed"]
    upload: numbers/A2-pubmed
    est_gpu_h: 5.0
  - id: A2-yfcc
    item: [1, 2, 5, 6]
    tree: fork
    depends_on: A1-yfcc
    cmds: ["RUN --suite n-timed-d192 --interleave --dataset {ds}   # yfcc10m, yfcc10m-synth (4096 lists only)"]
    upload: numbers/A2-yfcc
    est_gpu_h: 1.5
  - id: A2-laion10m
    item: [1, 2, 3, 5, 6]
    tree: fork
    depends_on: A1-laion10m
    cmds: ["RUN --suite n-timed-d256 --interleave --dataset {ds}   # laion10m, laion10m-synth"]
    upload: numbers/A2-laion10m
    est_gpu_h: 4.0
  - id: A2-laion30m-real
    item: [1, 2, 3, 4, 5, 6]
    tree: fork
    depends_on: A1-laion30m
    cmds:
      - "RUN --suite n-timed-d256 --interleave --dataset laion30m --algo linr_v2 --algo silvertorch   # V1 + V2 + SilverTorch exceed one A100-80GB at 30 M"
      - "RUN --suite n-timed-d256 --dataset laion30m --algo linr_v1_filter_mask"
    upload: numbers/A2-laion30m-real
    est_gpu_h: 4.5
  - id: A2-laion30m-synth
    item: [1, 2, 3, 5, 6]
    tree: fork
    depends_on: A1-laion30m-synth
    cmds:
      - "RUN --suite n-timed-d256 --interleave --dataset laion30m-synth --algo linr_v2 --algo silvertorch"
      - "RUN --suite n-timed-d256 --dataset laion30m-synth --algo linr_v1_filter_mask"
    upload: numbers/A2-laion30m-synth
    est_gpu_h: 4.0
  - id: A3-st-k2048
    item: 10
    tree: fork
    depends_on: [A1-small, A1-pubmed]
    cmds: ["RUN --suite n-st-k2048-d128 --interleave --dataset {ds}   # goodreads, arxiv", "RUN --suite n-st-k2048-d768 --interleave --dataset pubmed"]
    upload: numbers/A3-st-k2048
    est_gpu_h: 1.0
  - id: A1-bloom
    item: bloom directive (user 2026-10-12, controller plan 2026-10-12-211500000), priority 1
    tree: fork + harness `recheck` param (dev/numbers-bloom)
    depends_on: []
    cmds:
      - "RUN --suite n-bloom-curve --dataset {ds}   # in this order: goodreads, arxiv, laion1m, laion3m, pubmed, laion10m, laion30m"
      - "RUN --suite n-bloom-curve-synth --dataset {ds}   # goodreads-synth, arxiv-synth, laion1m-synth, laion3m-synth"
    upload: numbers/A1-bloom
    est_gpu_h: 4.5
  - id: A2-bloom
    item: bloom directive, priority 2 (k 100) then 3 (k 1000, small synth)
    tree: fork + harness `recheck` param
    depends_on: A1-bloom   # and pick_points over numbers/A1-bloom (results-draft)
    cmds: ["RUN --suite n-bloom-timed --interleave --dataset {ds}   # suite written after the picks"]
    upload: numbers/A2-bloom
    est_gpu_h: 7.0
  - id: A4-bloomwidth
    item: C4 (controller c3 ruling 1, 2026-10-12)
    tree: fork
    depends_on: []
    cmds: ["RUN --suite n-bloomwidth --dataset {ds}   # goodreads, arxiv, pubmed; quality only, no interleave"]
    upload: numbers/A4-bloomwidth
    est_gpu_h: 0.3

totals:
  linr_only_gpu_h: 9.3
  adapted_gpu_h: 37.1      # A0 0.4 + A1 11.9 + A1b 0.5 + A2 22.5 + A2b 0.8 + A3 1.0
  all_gpu_h: 46.4          # +20 % process start / data load / compile -> ~56
  per_queue_gpu_h: {d0: 13.0, d1: 10.4, p1: 16.0, b0: 7.0}   # d0 17.0 if it also runs A2-laion30m-synth
