bloom:
  m_bits: 1024
  k_hash: 5
strerun-arxiv:
  datasets:
  - arxiv
  dims:
  - 128
  filter_kinds:
  - bloom
  - clause
  ks:
  - 100
  - 1000
  ks_by_sweep:
    arxiv:
      all4:
      - 1000
      c0_maincat:
      - 1000
      c3_nversions:
      - 100
      - 1000
  batch_sizes:
  - 1
  - 16
  - 64
  seeds:
  - 0
  sweeps:
    arxiv:
    - all4
    - c0_maincat
    - c3_nversions
  interleave:
  - by:
    - algo
    - n_lists
  arms:
  - algo: linr_v1_filter_mask
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      arxiv:
        sweeps:
        - all4
        - c0_maincat
        - c3_nversions
  - algo: linr_v2
    backends:
    - triton
    filter_kinds:
    - clause
    datasets:
      arxiv:
        sweeps:
        - all4
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - all4
        query:
          n_probe:
          - 512
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - c0_maincat
        query:
          n_probe:
          - 128
          - 512
  - algo: silvertorch
    backends:
    - cuda
    filter_kinds:
    - bloom
    build:
      n_lists:
      - 2048
      recheck:
      - false
    datasets:
      arxiv:
        sweeps:
        - c3_nversions
        query:
          n_probe:
          - 24
          - 64
          - 128
          - 512
