  - {leg: timed-bloom-synth-d256-pode-s2, why: "synthetic LAION 30M seed 2 dropped by the user (2026-10-15 ~14:51Z; pod f's leg 92 stopped at 0 cells, not uploaded)"}
  - {leg: "metafork-pod1 / metafork-pode", why: "META-FORK grid dropped by the user (2026-10-14 10:00Z)"}
  - {leg: "final-c7-scorepath-pod1-s0 / final-seeds-c7-pod1-s0", why: "c7 out (user, 2026-10-14 14:00Z)"}
  - {leg: "timed-clause-d128 / d256 / d768", why: "the clause reference row runs lighter as fr-timed-clause-lite-* at tag final-freeze-clause, SilverTorch exact arms only (user, 2026-10-14 11:00Z)"}
