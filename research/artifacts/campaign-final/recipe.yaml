    index: 0
    worker: laion
    family: M1
    suite: filter
    dataset: arxiv
    tree: campaign-v2.12
    after: [stage-a100-x2-d]
    env: {CUDA_VISIBLE_DEVICES: '0', TORCHINDUCTOR_CACHE_DIR: /scratch/inductor/final-gpu0, VENV: /venvs/final-o3, UV_PROJECT_ENVIRONMENT: /venvs/final-o3}
    command: "\"$VENV/bin/python\" -m bench.cli run --dataset arxiv --dim 128 --suite filter --algo silvertorch --algo linr_v2 --out /scratch/final/gpu0 --resume"
    upload: campaign-final/arxiv-filter-d0
