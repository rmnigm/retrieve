# FULL-RERUN (roadmap step 7): everything the paper cites, rerun at one tag, into one results.parquet. README.md: the why, the seeds,
# the sizing. runbook-pod1.md / runbook-pode.md: the exact commands. One sequential driver per GPU (queue.sh), one job per GPU, every
# GPU step under `flock /scratch/gpu0.lock`; a timed comparison is read inside one leg on one pod.
recipe: 2
tag: final-freeze                        # library + harness + suites; every later fix is a new tag and a rerun of what it touches
profile: full                            # user GO 2026-10-13: 3 seeds wherever randomness matters, 1 for exact LiNR / the oracle, no reuse
order: seed-major                        # seed 0 / draw 0 of every leg first (a complete one-seed set), then seed 1, then seed 2
hub: {repo: pinkmeme/eval-results, prefix: fr/, legs: "fr/<leg>-<pod>-s<seed>", marks: "fr/marks/*", picks: fr/picks}
image: {torch: 2.10.0+cu128, triton: 3.6.0, cuda: '12.8', python: '3.11'}
venv: "/venvs/fr per pod, built once at the tag: uv sync --frozen --all-packages --all-groups --extra official, then scripts/build_official_o3.sh;
  official-fork's _C.so and Meta's -O3 .so are built per pod and are not byte-reproducible: their sha256 go in $FR/build.txt and every
  record's env (official_fork_build, official_build). The pods also differ in driver (pod 1 570.195.03, pod e 580.126.16), so every
  comparison family stays on one pod (below)."
seeds:
  random: [0, 1, 2]                      # SilverTorch builds (k-means), LiNR V3 (OPORP), synthetic draws (draw d = <ds>-synth-s<d> at job seed d), timing
  exact: [0]                             # fr-linr-* legs, the oracle; exact arms inside a seeded interleave group are timed at every seed, quality copied
  final_pass: "prep_config.py raises every final-pass suite with a SilverTorch or V3 arm to seeds 0-2"
  untimed: "grade_bloom, ceiling_adapted at SEED=0, 1, 2; fp_adapted and score_gaps are seed-free (once); META-FORK grid seed 0"
pods:
  pod1: {host: e75980, data: [pubmed-medcpt-dot, laion1m, laion3m, laion10m, laion30m, arxiv-papers (nsweep-synth's arxiv-synth)],
         families: [PubMed curves and timed, LAION 1-10 M curves and timed, every N-sweep leg (C1 / C5 across N), LAION 30 M final-pass suites, exact LiNR on PubMed and LAION]}
  pode: {host: a100-x1-e, data: [goodreads-work-id, arxiv-papers, laion30m, yambda-500m, pubmed-medcpt-dot (copied), laion1m / 3m / 10m (copied, spare)],
         families: [goodreads / arXiv curves and timed, LAION 30 M curves and timed, Yambda, V3 pools of goodreads / arXiv / PubMed, the width grid, PubMed synth crossover]}

per_seed:                                # queue.sh, for s in 0, 1, 2 (stage-1 legs whose suite has no seed s are skipped)
  - stage1: "curves fr-curve-d<dim> (--seed s), synth curves fr-curve-synth-s<s>-d<dim> (draw s), V3 pools fr-v3pool* (--seed s), fr-yambda (--seed s);
      at s = 0 also the exact LiNR legs fr-linr-* and fr-bloomwidth. Then the mark fr/marks/stage1-s<s>-<pod>."
  - picks: "s = 0 only. PICKS_POD (pod1) runs final-pass suites until pode's stage-1 mark is on the Hub, then make_picks.sh (pick.py on seed 0's
      stage-1 records of both pods -> fr/picks); pode runs final-pass suites until fr/picks appears. prep_config.py then adds the picks."
  - stage2: "fr-timed-bloom-d<dim> (k 100 + V3 matched recall), -k1000-, -k2048- and fr-timed-bloom-synth-s<s>-d<dim>, --interleave, --seed s"
  - untimed: "untimed.sh (grade_bloom at the timed points, ceiling_adapted; at s = 0 fp_adapted on pode, score_gaps on pod1) -> fr/untimed-<pod>-s<s>"
  - final_pass: "the pod's final-pass suites not yet done at seed s (all at s = 0; at s > 0 only the seeded ones)"
  - metafork: "s = 0 only: metafork_grid.sh (head grid, int32 and fp16, fork vs upstream) -> fr/metafork-<pod>"
  - clause_row: "fr-timed-clause-d<dim> (SilverTorch's exact clause mode, a reference row), last in each seed"

leg_driver: "run_leg.sh: check_suites.py --only <suite> (no LiNR bloom, SilverTorch bloom recheck false, no YFCC, no V2 bs 256 on PubMed), bench check,
  bench oracle, bench run --seed s [--interleave] --resume under flock and `timeout MAXH`, retry once (OOM: one algo per process), upload --verify,
  manifest sha -> $FR/manifests.tsv"
not_in_queue: "gls_adapted.py, product_recall.py, build_results.py: CPU, results-draft repoints them at fr/ after the run"
gate: "every planned cell ok (OOM fallbacks superseded), D1-G's four checks, 0 manifest gaps, check_suites.py 0 problems; per seed"
