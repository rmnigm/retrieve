[project]
name = "retrieve-workspace"
version = "0"
description = "Workspace meta-package: retrieve + evaluation share one .venv."
requires-python = ">=3.10"
dependencies = [
    "retrieve",
    "retrieve-evaluation",
]

[project.optional-dependencies]
# Re-exports retrieve's extra so `uv sync --extra official` works from the
# workspace root (the root is virtual; --extra resolves against it).
official = [
    "retrieve[official]",
]

[tool.uv]
package = false
# silvertorch's build backend imports torch (setup.py picks CUDAExtension when
# CUDA_HOME is set), so it must build against the torch already in this env
# rather than an isolated one that would pull a different CUDA build.
no-build-isolation-package = ["silvertorch"]

# Static metadata for silvertorch, so `uv lock` never has to run its setup.py
# (which imports torch and probes for nvcc). Matches setup.py at the pinned sha:
# version="1.0.0", install_requires=["torch>=2.0"].
[[tool.uv.dependency-metadata]]
name = "silvertorch"
version = "1.0.0"
requires-dist = ["torch>=2.0"]

[tool.uv.workspace]
members = ["retrieve", "evaluation"]

[tool.uv.sources]
retrieve = { workspace = true }
retrieve-evaluation = { workspace = true }
# Meta's official SilverTorch, pinned to the full sha of `main` @ 21aa35e
# (2026-07-23). Not on PyPI; no tags upstream. Bumping this is a deliberate PR
# that reruns the parity gate (docs/plans/silvertorch-official-integration.md D2).
silvertorch = { git = "https://github.com/meta-recsys/silvertorch", rev = "21aa35e28b6dd9a91e9ee35efb0857715e86bda7" }

[dependency-groups]
# Build tools for the no-build-isolation silvertorch extension; installed into
# the shared .venv by a plain `uv sync` at the workspace root.
dev = [
    "ninja>=1.11",
    "setuptools>=61",
    "wheel",
]
